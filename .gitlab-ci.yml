workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - checks

lint:
  stage: checks
  script:
    - nix-shell support/ci/run-lint.sh
  tags:
    - nix

checks:
  stage: checks
  script:
    - nix-shell support/ci/run-checks.sh
  tags:
    - nix
